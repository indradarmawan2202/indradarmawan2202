name: Generate Pacman Animation

on:
  # Dijalankan otomatis setiap 24 jam sekali
  schedule:
    - cron: "0 0 * * *" 
  
  # Mengizinkan kamu menjalankan script ini secara manual dari tab Actions
  workflow_dispatch:
  
  # Dijalankan otomatis setiap kali kamu melakukan push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Mengambil animasi snake/pacman dari kontribusi GitHub-mu
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Mendorong (push) hasil gambar animasi tersebut ke branch bernama 'output'
      - name: Push to github-pages
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
